<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="tituloSed">
  <title id="tituloSed">Pantalla de captura por voz de SED</title>

  <rect width="800" height="560" fill="#f3ece0"/>

  <!-- Sombra del teléfono -->
  <g transform="translate(400 280) scale(1.08) translate(-400 -280)">
  <rect x="292" y="52" width="240" height="480" rx="30" fill="#ded1ba" opacity="0.55"/>

  <!-- Marco del teléfono -->
  <rect x="280" y="40" width="240" height="480" rx="30" fill="#22392f"/>
  <rect x="292" y="52" width="216" height="456" rx="20" fill="#fffdf8"/>

  <!-- Encabezado -->
  <text x="312" y="86" font-family="Georgia, serif" font-size="18" fill="#22392f">SED</text>
  <text x="312" y="104" font-family="Segoe UI, sans-serif" font-size="10" fill="#8b8271">Embarque 12 · Contenedor DUF-4471</text>
  <rect x="404" y="72" width="86" height="18" rx="3" fill="#f3e5cd"/>
  <text x="412" y="85" font-family="Consolas, monospace" font-size="9" letter-spacing="1" fill="#8a5a15">SIN SEÑAL</text>

  <!-- Onda de voz -->
  <g fill="#bf7218">
    <rect x="316" y="176" width="5" height="26" rx="2.5"/>
    <rect x="327" y="160" width="5" height="58" rx="2.5"/>
    <rect x="338" y="146" width="5" height="86" rx="2.5"/>
    <rect x="349" y="132" width="5" height="114" rx="2.5"/>
    <rect x="360" y="150" width="5" height="78" rx="2.5"/>
    <rect x="371" y="138" width="5" height="102" rx="2.5"/>
    <rect x="382" y="156" width="5" height="66" rx="2.5"/>
    <rect x="393" y="128" width="5" height="122" rx="2.5"/>
    <rect x="404" y="148" width="5" height="82" rx="2.5"/>
    <rect x="415" y="136" width="5" height="106" rx="2.5"/>
    <rect x="426" y="162" width="5" height="54" rx="2.5"/>
    <rect x="437" y="152" width="5" height="74" rx="2.5"/>
    <rect x="448" y="170" width="5" height="38" rx="2.5"/>
    <rect x="459" y="164" width="5" height="50" rx="2.5"/>
    <rect x="470" y="176" width="5" height="26" rx="2.5"/>
  </g>
  <text x="400" y="286" text-anchor="middle" font-family="Consolas, monospace" font-size="15" letter-spacing="2" fill="#22392f">LOTE 2401-18</text>
  <text x="400" y="306" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#8b8271">Talla 12 · Marca Camposol · 4.2 kg</text>

  <!-- Registros -->
  <g font-family="Consolas, monospace" font-size="10" fill="#8b8271">
    <rect x="312" y="330" width="176" height="30" rx="4" fill="#f7f0e4"/>
    <circle cx="326" cy="345" r="6" fill="#4d7c5f"/>
    <path d="M323 345l2 2 4-4" stroke="#fffdf8" stroke-width="1.6" fill="none"/>
    <text x="340" y="349">2401-18 · fila 01</text>

    <rect x="312" y="366" width="176" height="30" rx="4" fill="#f7f0e4"/>
    <circle cx="326" cy="381" r="6" fill="#4d7c5f"/>
    <path d="M323 381l2 2 4-4" stroke="#fffdf8" stroke-width="1.6" fill="none"/>
    <text x="340" y="385">2401-19 · fila 01</text>

    <rect x="312" y="402" width="176" height="30" rx="4" fill="#f7f0e4" stroke="#bf7218" stroke-dasharray="3 3"/>
    <text x="340" y="421">2401-20 · fila 01</text>
  </g>

  <!-- Botón -->
  <rect x="312" y="452" width="176" height="40" rx="6" fill="#22392f"/>
  <text x="400" y="477" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#f7f0e4">CONFIRMAR FILA</text>
  </g>
</svg>
